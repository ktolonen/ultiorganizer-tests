name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; let every push to main get its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  harness:
    name: Test harness (full matrix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4
        with:
          path: ultiorganizer-tests
      - name: Checkout SUT (ultiorganizer main)
        uses: actions/checkout@v4
        with:
          repository: ktolonen/ultiorganizer
          ref: master
          path: ultiorganizer
      - name: Run doctor
        working-directory: ultiorganizer-tests
        run: ./doctor
      # Host-only Node tests over the SUT's script/*.js. Deliberately not part
      # of ./test:matrix (no DB, browser, or container), so they need their own
      # step or they never run in CI. Fast, and resolves the SUT from the
      # sibling checkout above by default.
      - name: Run client JavaScript tests
        working-directory: ultiorganizer-tests
        run: ./test:js
      - name: Run full matrix
        working-directory: ultiorganizer-tests
        run: ./test:matrix
      - name: Publish job summary
        if: always()
        working-directory: ultiorganizer-tests
        run: |
          {
            echo "# Test harness — full matrix"
            echo
            found=0
            while IFS= read -r f; do
              found=1
              cat "$f"
              echo
            done < <(find reports -path '*/summary/summary.md' | sort)
            if [ "$found" -eq 0 ]; then
              echo "_No case summaries were produced; see the run log above._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build HTML report
        if: always()
        working-directory: ultiorganizer-tests
        run: ./report:html
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: ultiorganizer-tests/reports/
          retention-days: 14
