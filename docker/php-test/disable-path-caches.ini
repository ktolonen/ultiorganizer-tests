; The harness re-points the .runtime/webroot symlink at a different case's
; SUT copy between runs without restarting Apache. PHP's realpath cache and
; opcache (with opcache.revalidate_path=Off) would then serve stale path
; resolutions and stale bytecode whose __DIR__ still points at the previous
; case, causing cross-case includes and "Cannot redeclare ..." fatals.
;
; Disabling both caches makes every request resolve the current case fresh.
; The cost is negligible for the short-lived smoke/crawl requests this
; container serves.
realpath_cache_size = 0
opcache.enable = 0
