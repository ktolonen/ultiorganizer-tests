; PCOV is installed for in-process code coverage of the unit and integration
; suites, but left disabled by default so the HTTP-driven suites and any
; non-coverage run pay nothing. The harness opts in per invocation with
; `php -d pcov.enabled=1 -d pcov.directory=<sut> ...` (see scripts/container_runner.py).
pcov.enabled = 0
